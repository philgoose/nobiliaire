<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOBILIAIRE 업무 문서 양식 — 작성 후 PDF 저장</title>
<meta name="description" content="상담·매칭·성혼 관리 문서를 화면에서 작성하고 A4 한 장 PDF로 저장합니다.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --ink:#15161A; --ink2:#3C3E45; --ink3:#787878; --ink4:#8E8E8E; --ph:#B4B4B4;
  --tp:#A18C74; --tp2:#8A7660; --tpl:#F2EDE6;
  --bg:#E9E9E9; --line:#D2D2D2; --line2:#E3E3E3; --soft:#F8F8F8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,'Pretendard Variable',-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
.ser{font-family:'Playfair Display',serif}

.top{background:#000;padding:15px 0}
.tin{max-width:1250px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:16px}
.lg img{height:26px;width:auto;display:block}
.sp{width:1px;height:20px;background:rgba(255,255,255,.22)}
.lg .mk{font-size:11px;color:#8E8E8E;letter-spacing:.4px}
.tt{font-size:11px;color:#8E8E8E;letter-spacing:1.6px;text-transform:uppercase}

.guide{background:#fff;border-bottom:1px solid var(--line2);color:var(--ink2);font-size:12.5px;padding:11px 20px;text-align:center}
.guide b{color:var(--ink)}
.guide em{font-style:normal;color:var(--tp2);font-weight:600}

.wrap{max-width:1250px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:244px 1fr;gap:22px;align-items:start}
.nav{position:sticky;top:18px}
.navt{font-size:10px;font-weight:700;letter-spacing:1.8px;color:var(--ink4);margin:0 0 11px 2px}
.nitem{display:block;width:100%;text-align:left;font:inherit;background:#fff;border:1px solid var(--line2);
  border-radius:3px;padding:13px 15px;margin-bottom:7px;cursor:pointer;transition:.14s;position:relative}
.nitem::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:.14s}
.nitem:hover::before{background:var(--tp)}
.nitem.on{background:#000;border-color:#000}
.nitem.on::before{background:var(--tp)}
.nitem .nn{font-size:13.5px;font-weight:600;letter-spacing:-.2px;display:block}
.nitem .nd{font-size:11px;color:var(--ink4);margin-top:3px;display:block;line-height:1.5}
.nitem.on .nn{color:#fff} .nitem.on .nd{color:#8E8E8E}

.acts{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:13px;font-weight:600;padding:11px 20px;border-radius:3px;border:0;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:.14s;letter-spacing:-.2px}
.bp{background:#000;color:#fff}
.bp:hover{background:var(--tp2)}
.bs{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.bs:hover{background:var(--soft)}
.hintx{font-size:11.5px;color:var(--ink4);margin-left:auto}

/* A4 */
.sheet{width:210mm;max-width:100%;min-height:297mm;margin:0 auto;background:#fff;padding:15mm 16mm;
  box-shadow:0 4px 26px rgba(0,0,0,.13);font-size:10.6px;line-height:1.58}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  border-bottom:1.6px solid var(--ink);padding-bottom:10px;margin-bottom:3px}
.dh img{height:19px;width:auto;display:block;margin:0 0 9px 0}
.dh h1{font-size:19px;font-weight:500;letter-spacing:-.3px;line-height:1.3}
.dh .sb{font-size:10px;color:var(--ink4);margin-top:3px;letter-spacing:.2px}
.dh .og{text-align:right;font-size:9.4px;color:var(--ink4);line-height:1.65;white-space:nowrap;letter-spacing:.5px}
.dh .og b{display:block;color:var(--ink);font-size:10px;letter-spacing:1.4px}

.meta{display:flex;border-bottom:1px solid var(--line2);margin-bottom:11px;font-size:10px;flex-wrap:wrap}
.meta>div{flex:1;min-width:108px;padding:7px 10px 7px 0;border-right:1px solid var(--line2);margin-right:10px}
.meta>div:last-child{border-right:none;margin-right:0}
.meta span{display:block;color:var(--ink4);font-size:8.8px;letter-spacing:1px;margin-bottom:2px;text-transform:uppercase}

h2{font-size:10.4px;font-weight:700;margin:12px 0 5px;letter-spacing:.6px;color:var(--ink);
  display:flex;align-items:center;gap:7px}
h2::before{content:"";width:12px;height:1.5px;background:var(--tp);flex:0 0 auto}
table{width:100%;border-collapse:collapse;margin-bottom:3px}
th,td{border-bottom:1px solid var(--line2);padding:5px 8px;font-size:10.1px;vertical-align:top;line-height:1.55}
thead th{border-bottom:1.2px solid var(--ink);background:none;font-weight:700;color:var(--ink2);text-align:left;
  white-space:nowrap;font-size:9.2px;letter-spacing:.7px;padding-bottom:4px}
tbody th{background:var(--soft);font-weight:600;color:var(--ink2);text-align:left;white-space:nowrap;font-size:9.6px;
  border-right:1px solid var(--line2)}
td.c{text-align:center}
tbody tr td{border-left:none}
.bx{border:1px solid var(--line2);border-left:2px solid var(--tp);padding:8px 11px;font-size:10.3px;line-height:1.65;min-height:36px;background:#FCFBFA}
.al{border:1px solid #E0D3C2;background:#FBF7F2;padding:8px 11px;font-size:10.1px;line-height:1.6;min-height:34px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{font-size:8.8px;color:var(--ink4);margin-top:4px;line-height:1.55}

.ed{display:block;min-height:1.5em;outline:none;padding:1px 2px;border-radius:2px}
.ed:empty::before{content:attr(data-ph);color:var(--ph)}
.ed:focus{background:var(--tpl);box-shadow:inset 0 0 0 1px var(--tp)}
.lines .ed{border-bottom:1px dotted var(--line);margin-bottom:6px;padding-bottom:3px}

.sg{margin-top:12px;display:grid;border-top:1.2px solid var(--ink);border-bottom:1px solid var(--line2)}
.sg>div{padding:7px 8px 24px;font-size:9px;color:var(--ink4);text-align:center;border-right:1px solid var(--line2);
  letter-spacing:1px}
.sg>div:last-child{border-right:0}
.ft{margin-top:10px;font-size:8.8px;color:var(--ink4);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;letter-spacing:.2px}
.ft b{color:var(--ink2)}

@media print{
  body *{visibility:hidden}
  .sheet,.sheet *{visibility:visible}
  .sheet{position:absolute;left:0;top:0;width:100%;min-height:0;margin:0;padding:0;box-shadow:none}
  .ed:empty::before{content:""}
  .ed:focus{background:none;box-shadow:none}
  .lines .ed{border-bottom:1px solid #E0E0E0}
  @page{size:A4;margin:14mm 15mm}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
@media (max-width:1000px){
  .wrap{grid-template-columns:1fr;padding:16px 12px 48px}
  .nav{position:static;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .navt{display:none}
  .nitem{min-width:196px;margin-bottom:0;flex:0 0 auto}
  .sheet{padding:18px 14px;min-height:0}
  .hintx{display:none}
  .btn{flex:1;justify-content:center}
}
</style>
</head>
<body>

<div class="top"><div class="tin">
  <div class="lg">
    <img src="assets/nobiliaire-wordmark.svg" alt="NOBILIAIRE">
    <div class="sp"></div>
    <div class="mk">제작 좋은기분(Feelsogood^^)</div>
  </div>
  <div class="tt">Document Forms</div>
</div></div>

<div class="guide">
  왼쪽에서 양식을 고르고 <b>옅은 글씨 위를 눌러 바로 입력</b>하십시오. <em>PDF로 저장</em>을 누르면 A4 한 장으로 저장됩니다. 입력 내용은 서버로 전송되지 않습니다.
</div>

<div class="wrap">
  <div class="nav" id="nav"><div class="navt">FORMS</div></div>
  <div>
    <div class="acts">
      <button class="btn bp" id="pdf">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1.8v8.4M4.6 7l3.4 3.4L11.4 7M2.4 13.4h11.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        PDF로 저장
      </button>
      <button class="btn bs" id="clr">입력 내용 비우기</button>
      <span class="hintx">인쇄 창에서 대상을 "PDF로 저장"으로 선택하십시오</span>
    </div>
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script>
const ed=(ph,cls)=>`<div class="ed ${cls||''}" contenteditable="true" data-ph="${ph}"></div>`;
const rows=(n,cells)=>Array.from({length:n},()=>`<tr>${cells.map(c=>`<td${c[1]?' class="'+c[1]+'"':''}>${ed(c[0])}</td>`).join('')}</tr>`).join('');
const FORMS=[
{
 id:'consult', nav:'입회 상담 기록', nd:'신규 상담 → 플랜 제안',
 title:'입회 상담 기록', sub:'신규 상담 내용 · 희망 조건 · 플랜 제안',
 meta:[['상담일',''],['상담 경로','유입 경로'],['담당 컨설턴트',''],['회원번호','가번호']],
 body:`
 <h2>1. 상담 개요</h2>
 <div class="bx">${ed('방문 경위와 현재 결혼 준비 상황. 무엇을 해결하러 왔는지 한두 문장으로.')}</div>

 <h2>2. 희망 조건</h2>
 <table><thead><tr><th style="width:20%">구분</th><th style="width:30%">희망</th><th>수용 가능 범위</th><th style="width:14%">우선순위</th></tr></thead>
 <tbody>${rows(5,[['연령 / 지역 / 직업 …'],[''],[''],['상·중·하','c']])}</tbody></table>

 <h2>3. 가치관 · 라이프스타일</h2>
 <table><tbody>
 <tr><th style="width:96px">관계관</th><td>${ed('어떤 관계를 원하는가 — 본인 표현 그대로')}</td></tr>
 <tr><th>생활 패턴</th><td>${ed('근무 형태, 주중·주말 가용 시간, 거주 형태')}</td></tr>
 <tr><th>관심사</th><td>${ed('대화 소재가 되는 지점')}</td></tr>
 <tr><th>과거 경험</th><td>${ed('이전 만남에서 맞지 않았던 지점 — 조건보다 이쪽이 매칭에 더 쓰입니다')}</td></tr>
 </tbody></table>

 <h2>4. 플랜 제안</h2>
 <table><thead><tr><th style="width:26%">제안 플랜</th><th>제안 사유</th><th style="width:26%">고객 반응</th></tr></thead>
 <tbody>${rows(2,[[''],[''],['']])}</tbody></table>

 <h2>5. 담당자 판단</h2>
 <div class="bx">${ed('성혼 가능성과 근거, 매칭 시 먼저 조율해야 할 지점. 기록에는 안 남지만 전달해야 할 인상.')}</div>

 <h2>6. 다음 조치</h2>
 <table><thead><tr><th style="width:5%">No</th><th>조치</th><th style="width:16%">담당</th><th style="width:16%">기한</th></tr></thead>
 <tbody><tr><td class="c">1</td><td>${ed('')}</td><td>${ed('')}</td><td>${ed('')}</td></tr>
 <tr><td class="c">2</td><td>${ed('')}</td><td>${ed('')}</td><td>${ed('')}</td></tr></tbody></table>
 <div class="note">※ 본 기록은 사내 개인정보 처리방침에 따라 보관·파기합니다. 민감정보에 해당하는 항목은 별도 동의 절차를 확인한 뒤 기재하십시오.</div>`,
 sign:['담당 컨설턴트','팀장','본부장']
},
{
 id:'matching', nav:'매칭 제안 검토서', nd:'제안 전 적합도 검토',
 title:'매칭 제안 검토서', sub:'조건 대조 · 적합 지점 · 사전 조율 사항',
 meta:[['작성일',''],['담당',''],['회원 A','회원번호'],['회원 B','회원번호']],
 body:`
 <h2>1. 제안 요지</h2>
 <div class="bx">${ed('왜 이 두 분인가 — 조건이 아니라 맞물리는 지점을 한두 문장으로.')}</div>

 <h2>2. 조건 대조</h2>
 <table><thead><tr><th style="width:22%">항목</th><th style="width:30%">회원 A</th><th style="width:30%">회원 B</th><th>적합</th></tr></thead>
 <tbody>${rows(5,[['연령 / 지역 / 직업 / 결혼 시기 …'],[''],[''],['○△×','c']])}</tbody></table>

 <h2>3. 맞는 지점 / 우려 지점</h2>
 <div class="two">
   <div><table><thead><tr><th>맞는 지점</th></tr></thead><tbody>${rows(3,[['']])}</tbody></table></div>
   <div><table><thead><tr><th>우려 지점</th></tr></thead><tbody>${rows(3,[['']])}</tbody></table></div>
 </div>

 <h2>4. 사전 조율 필요 사항</h2>
 <table><thead><tr><th style="width:5%">No</th><th style="width:28%">항목</th><th>조율 방향 · 전달 방식</th><th style="width:14%">담당</th></tr></thead>
 <tbody><tr><td class="c">1</td><td>${ed('')}</td><td>${ed('')}</td><td>${ed('')}</td></tr>
 <tr><td class="c">2</td><td>${ed('')}</td><td>${ed('')}</td><td>${ed('')}</td></tr></tbody></table>

 <h2>5. 제안 판단</h2>
 <table><tbody>
 <tr><th style="width:96px">판단</th><td>${ed('제안 / 조건부 제안 / 보류 — 하나를 적고 사유를 함께')}</td></tr>
 <tr><th>제안 시점</th><td>${ed('언제, 어느 쪽부터 접촉할 것인가')}</td></tr>
 </tbody></table>`,
 sign:['담당','팀장','매칭 심의']
},
{
 id:'feedback', nav:'만남 후 피드백', nd:'양측 반응 → 다음 매칭',
 title:'만남 후 피드백 기록', sub:'양측 피드백 · 일치 지점 · 다음 조치',
 meta:[['만남일',''],['장소',''],['회원 A','회원번호'],['회원 B','회원번호']],
 body:`
 <h2>1. 만남 개요</h2>
 <table><tbody><tr><th style="width:84px">소요 시간</th><td style="width:28%">${ed('')}</td>
 <th style="width:84px">분위기</th><td>${ed('')}</td></tr>
 <tr><th>재만남 의사</th><td>${ed('A :')}</td><th>&nbsp;</th><td>${ed('B :')}</td></tr></tbody></table>

 <h2>2. 양측 피드백</h2>
 <div class="two">
   <div><table><thead><tr><th>회원 A</th></tr></thead><tbody><tr><td>${ed('본인 표현 그대로 — 요약하지 말고 쓴 말을 남기십시오')}</td></tr></tbody></table></div>
   <div><table><thead><tr><th>회원 B</th></tr></thead><tbody><tr><td>${ed('본인 표현 그대로')}</td></tr></tbody></table></div>
 </div>

 <h2>3. 일치 · 불일치 지점</h2>
 <table><thead><tr><th style="width:24%">항목</th><th style="width:34%">회원 A 인식</th><th>회원 B 인식</th></tr></thead>
 <tbody>${rows(3,[[''],[''],['']])}</tbody></table>

 <h2>4. 담당자 해석</h2>
 <div class="bx">${ed('말한 내용과 실제 반응이 어긋난 지점. 다음 매칭에서 바꿔야 할 조건은 무엇인가.')}</div>

 <h2>5. 다음 조치</h2>
 <table><thead><tr><th style="width:5%">No</th><th>조치</th><th style="width:16%">대상</th><th style="width:16%">기한</th></tr></thead>
 <tbody><tr><td class="c">1</td><td>${ed('')}</td><td>${ed('')}</td><td>${ed('')}</td></tr>
 <tr><td class="c">2</td><td>${ed('')}</td><td>${ed('')}</td><td>${ed('')}</td></tr></tbody></table>`,
 sign:['담당 컨설턴트','팀장']
},
{
 id:'weekly', nav:'주간 운영 브리핑', nd:'컨설턴트 보고 → 임원 1장',
 title:'주간 운영 브리핑', sub:'핵심 지표 · 컨설턴트별 현황 · 결정 안건',
 meta:[['작성일',''],['대상 기간',''],['작성',''],['취합 범위','']],
 body:`
 <h2>1. 한 줄 요약</h2>
 <div class="bx">${ed('이번 주 운영 상황을 한 문장으로.')}</div>

 <h2>2. 핵심 지표</h2>
 <table><thead><tr><th style="width:28%">구분</th><th style="width:16%">금주</th><th style="width:18%">전주 대비</th><th>비고</th></tr></thead>
 <tbody><tr><td>신규 상담</td><td class="c">${ed('')}</td><td class="c">${ed('')}</td><td>${ed('')}</td></tr>
 <tr><td>입회</td><td class="c">${ed('')}</td><td class="c">${ed('')}</td><td>${ed('')}</td></tr>
 <tr><td>매칭 성사</td><td class="c">${ed('')}</td><td class="c">${ed('')}</td><td>${ed('')}</td></tr>
 <tr><td>성혼</td><td class="c">${ed('')}</td><td class="c">${ed('')}</td><td>${ed('')}</td></tr>
 <tr><td>중도 해지 · 휴면</td><td class="c">${ed('')}</td><td class="c">${ed('')}</td><td>${ed('')}</td></tr></tbody></table>

 <h2>3. 컨설턴트별 현황</h2>
 <table><thead><tr><th style="width:20%">담당</th><th style="width:12%">상담</th><th style="width:12%">매칭</th><th style="width:12%">성혼</th><th>특이사항</th></tr></thead>
 <tbody>${rows(4,[[''],['','c'],['','c'],['','c'],['']])}</tbody></table>

 <h2>4. 결정이 필요한 안건</h2>
 <table><thead><tr><th style="width:5%">No</th><th style="width:24%">안건</th><th>내용 · 선택지</th><th style="width:14%">결정</th></tr></thead>
 <tbody><tr><td class="c">1</td><td>${ed('')}</td><td>${ed('')}</td><td></td></tr>
 <tr><td class="c">2</td><td>${ed('')}</td><td>${ed('')}</td><td></td></tr></tbody></table>

const sheet=document.getElementById('sheet'), nav=document.getElementById('nav');
let cur=0;

function render(i){
  const f=FORMS[i];
  sheet.innerHTML=`
  <div class="dh">
    <div>
      <img src="assets/nobiliaire-wordmark-ink.svg" alt="NOBILIAIRE">
      <h1 class="ser">${f.title}</h1>
      <div class="sb">${f.sub}</div>
    </div>
    <div class="og"><b>NOBILIAIRE</b>사내 문서</div>
  </div>
  <div class="meta">${f.meta.map(m=>`<div><span>${m[0]}</span><div class="ed" contenteditable="true" data-ph="${m[1]||'입력'}"></div></div>`).join('')}</div>
  ${f.body}
  <div class="sg" style="grid-template-columns:repeat(${f.sign.length},1fr)">${f.sign.map(s=>`<div>${s}</div>`).join('')}</div>
  <div class="ft"><span>본 양식은 사내 문서 작성용 서식입니다. 내부 규정에 맞춰 수정하여 사용하실 수 있습니다.</span>
  <span><b>좋은기분(Feelsogood^^)</b></span></div>`;
}

nav.insertAdjacentHTML('beforeend', FORMS.map((f,i)=>
  `<button class="nitem${i===0?' on':''}" data-i="${i}"><span class="nn">${f.nav}</span><span class="nd">${f.nd}</span></button>`).join(''));

nav.addEventListener('click',e=>{
  const b=e.target.closest('.nitem'); if(!b) return;
  cur=+b.dataset.i;
  nav.querySelectorAll('.nitem').forEach(x=>x.classList.toggle('on',x===b));
  render(cur); window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('pdf').addEventListener('click',()=>window.print());
document.getElementById('clr').addEventListener('click',()=>render(cur));
