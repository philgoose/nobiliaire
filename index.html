<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOBILIAIRE 경영 문서 양식 — 작성 후 PDF 저장</title>
<meta name="description" content="화면에서 바로 작성하고 A4 한 장 PDF로 저장하는 경영 문서 양식 모음.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14264A; --navy2:#1E3665; --gold:#F3B94D; --gold2:#BE7B12;
  --bg:#EDEFF3; --card:#fff; --line:#C9CEDA; --line2:#E6E8EE;
  --ink:#14264A; --ink2:#444C5E; --ink3:#767E90; --ph:#AEB4C0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}

/* top */
.top{background:var(--navy);padding:13px 0}
.tin{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:14px}
.lg img.wm{height:36px;width:auto;display:block}
.sp{width:1px;height:24px;background:rgba(255,255,255,.22)}
.fs{display:flex;align-items:center;gap:7px}
.fs img{width:24px;height:24px;display:block}
.fs span{font-size:12.5px;color:#C3CEE4;font-weight:500}
.tt{font-size:12.5px;color:#A9B6D1}
.tt b{color:#fff}

.guide{background:#FFF8E8;border-bottom:1px solid #F0DFB4;color:#7A5A12;font-size:13px;padding:10px 20px;text-align:center}
.guide b{color:#5C430C}

/* layout */
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:238px 1fr;gap:22px;align-items:start}
.nav{position:sticky;top:18px}
.navt{font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--ink3);margin:0 0 10px 4px}
.nitem{display:block;width:100%;text-align:left;font:inherit;background:var(--card);border:1px solid var(--line2);
  border-radius:11px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:.14s}
.nitem:hover{border-color:var(--gold);transform:translateX(2px)}
.nitem.on{background:var(--navy);border-color:var(--navy)}
.nitem .nn{font-size:14px;font-weight:700;letter-spacing:-.3px;display:block}
.nitem .nd{font-size:11.5px;color:var(--ink3);margin-top:3px;display:block;line-height:1.5}
.nitem.on .nn{color:#fff} .nitem.on .nd{color:#A9B6D1}

.acts{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:9px;border:0;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:.14s}
.bp{background:var(--navy);color:#fff}
.bp:hover{background:var(--navy2)}
.bs{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.bs:hover{background:#F4F5F8}
.hintx{font-size:12.3px;color:var(--ink3);margin-left:auto}

/* A4 sheet */
.sheet{width:210mm;max-width:100%;min-height:297mm;margin:0 auto;background:#fff;padding:15mm 16mm;
  box-shadow:0 6px 30px rgba(20,38,74,.16);font-size:11px;line-height:1.6}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  border-bottom:2.5px solid var(--navy);padding-bottom:9px;margin-bottom:4px}
.dh img{height:26px;width:auto;display:block;margin:0 0 7px -2px}
.dh h1{font-size:18px;font-weight:700;letter-spacing:-.7px;line-height:1.35}
.dh .sb{font-size:10.5px;color:var(--ink3);margin-top:2px}
.dh .og{text-align:right;font-size:10px;color:var(--ink3);line-height:1.6;white-space:nowrap}
.dh .og b{display:block;color:var(--navy);font-size:11px}

.meta{display:flex;border:1px solid var(--line);border-top:none;margin-bottom:10px;font-size:10.2px;flex-wrap:wrap}
.meta>div{flex:1;min-width:110px;padding:5px 9px;border-right:1px solid var(--line)}
.meta>div:last-child{border-right:none}
.meta span{display:block;color:var(--ink3);font-size:9.4px;margin-bottom:1px}

h2{font-size:11.8px;font-weight:700;margin:11px 0 5px;padding-left:8px;border-left:3px solid var(--gold);letter-spacing:-.3px}
table{width:100%;border-collapse:collapse;margin-bottom:4px}
th,td{border:1px solid var(--line);padding:4.5px 8px;font-size:10.4px;vertical-align:top;line-height:1.55}
th{background:#F3F5F8;font-weight:700;color:var(--ink2);text-align:left;white-space:nowrap;font-size:10px}
td.c{text-align:center}
.lead{background:#F7F9FC;border:1px solid #DDE3EC;border-left:3px solid var(--navy);padding:7px 10px;
  font-size:10.8px;line-height:1.65;min-height:38px}
.risk{border:1px solid #E3BDBD;background:#FCF3F3;padding:7px 10px;font-size:10.4px;line-height:1.6;min-height:34px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:9.6px;color:var(--ink3);margin-top:3px}

/* editable */
.ed{display:block;min-height:1.5em;outline:none;padding:1px 2px;border-radius:3px}
.ed:empty::before{content:attr(data-ph);color:var(--ph)}
.ed:focus{background:#FFFBEF;box-shadow:inset 0 0 0 1px var(--gold)}
.edl{min-height:4.4em}
.lines .ed{border-bottom:1px dotted var(--line);margin-bottom:5px;padding-bottom:3px}

.sg{margin-top:10px;display:grid;border:1px solid var(--line)}
.sg>div{padding:6px 8px 22px;font-size:9.6px;color:var(--ink3);text-align:center;border-right:1px solid var(--line)}
.sg>div:last-child{border-right:0}
.ft{margin-top:11px;padding-top:7px;border-top:1px solid #E2E5EC;font-size:9.4px;color:var(--ink3);
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ft b{color:var(--ink2)}

@media print{
  body *{visibility:hidden}
  .sheet,.sheet *{visibility:visible}
  .sheet{position:absolute;left:0;top:0;width:100%;min-height:0;margin:0;padding:0;box-shadow:none}
  .ed:empty::before{content:""}
  .ed:focus{background:none;box-shadow:none}
  .lines .ed{border-bottom:1px solid #DFE3EA}
  @page{size:A4;margin:14mm 15mm}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
@media (max-width:1000px){
  .wrap{grid-template-columns:1fr;padding:16px 12px 48px}
  .nav{position:static;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .navt{display:none}
  .nitem{min-width:190px;margin-bottom:0;flex:0 0 auto}
  .sheet{padding:18px 14px;min-height:0}
  .hintx{display:none}
  .btn{flex:1;justify-content:center}
}
</style>
</head>
<body>

<div class="top"><div class="tin">
  <div class="lg">
    <img class="wm" src="assets/nobiliaire-wordmark.svg" alt="NOBILIAIRE">
    <div class="sp"></div>
    <div class="fs"><img src="assets/feelsogood-mark.svg" alt=""><span>좋은기분 Feelsogood</span></div>
  </div>
  <div class="tt"><b>경영 문서 양식</b> · 작성 후 PDF 저장</div>
</div></div>

<div class="guide">
  왼쪽에서 양식을 고르고 <b>회색 글씨 위를 눌러 바로 입력</b>하십시오. <b>PDF로 저장</b>을 누르면 A4 한 장으로 저장됩니다. 입력 내용은 서버로 전송되지 않습니다.
</div>

<div class="wrap">
  <div class="nav" id="nav"><div class="navt">양식 선택</div></div>
  <div>
    <div class="acts">
      <button class="btn bp" id="pdf">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 1.8v8.4M4.6 7l3.4 3.4L11.4 7M2.4 13.4h11.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        PDF로 저장
      </button>
      <button class="btn bs" id="clr">입력 내용 비우기</button>
      <span class="hintx">인쇄 창에서 대상을 "PDF로 저장"으로 선택하십시오</span>
    </div>
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script>
const ed=(ph,cls)=>`<div class="ed ${cls||''}" contenteditable="true" data-ph="${ph}"></div>`;
const rows=(n,cells)=>Array.from({length:n},()=>`<tr>${cells.map(c=>`<td${c[1]?' class="'+c[1]+'"':''}>${ed(c[0])}</td>`).join('')}</tr>`).join('');
const FORMS=[
{
 id:'brief', nav:'주간 경영 브리핑', nd:'부서 보고 취합 → 임원 1장',
 title:'주간 경영 브리핑', sub:'부서별 주간보고 취합 · 결정 안건 및 리스크 정리',
 meta:[['작성일',''],['대상 기간','11.13 ~ 11.19'],['작성 부서',''],['취합 부서 수','']],
 body:`
 <h2>1. 한 줄 요약</h2>
 <div class="lead">${ed('이번 주 경영 상황을 한 문장으로. 예) 매출은 계획대로이나 외주 지연이 두 부서에 동시에 걸려 출시 일정이 흔들리고 있습니다.')}</div>

 <h2>2. 핵심 지표</h2>
 <table><thead><tr><th style="width:26%">구분</th><th style="width:18%">금주</th><th style="width:18%">전주 대비</th><th>비고</th></tr></thead>
 <tbody>${rows(4,[['지표명'],['수치','c'],['증감','c'],['']])}</tbody></table>

 <h2>3. 이번 주 핵심</h2>
 <div class="lines">${ed('1.')}${ed('2.')}</div>

 <h2>4. 부서별 진행 현황</h2>
 <table><thead><tr><th style="width:22%">부서</th><th style="width:14%">진척</th><th>특이사항</th></tr></thead>
 <tbody>${rows(4,[['부서명'],['%','c'],['']])}</tbody></table>

 <h2>5. 결정이 필요한 안건</h2>
 <table><thead><tr><th style="width:5%">No</th><th style="width:22%">안건</th><th>내용 · 선택지</th><th style="width:13%">요청 부서</th><th style="width:14%">결정</th></tr></thead>
 <tbody><tr><td class="c">1</td><td>${ed('안건명')}</td><td>${ed('배경과 선택지, 각 선택의 결과')}</td><td>${ed('')}</td><td></td></tr>
 <tr><td class="c">2</td><td>${ed('안건명')}</td><td>${ed('')}</td><td>${ed('')}</td><td></td></tr></tbody></table>

 <div class="two">
   <div><h2>6. 리스크</h2>
   <div class="risk">${ed('놓치면 안 되는 사항과 예상 영향, 대응 방향')}</div></div>
   <div><h2>7. 부서 보고를 가로질러 본 지점</h2>
   <div class="lead">${ed('여러 부서가 각각 보고했으나 원인이 하나인 지점')}</div></div>
 </div>`,
 sign:['작성','부서장','담당 임원','대표이사']
},
{
 id:'minutes', nav:'임원 회의록', nd:'결정사항 · 실행항목 추적',
 title:'임원 회의록', sub:'안건 · 논의 · 결정사항 · 실행항목',
 meta:[['일시',''],['장소',''],['주재',''],['작성자','']],
 body:`
 <h2>1. 참석자</h2>
 <table><tbody><tr><th style="width:76px">참석</th><td>${ed('직위 성명, 직위 성명 …')}</td></tr>
 <tr><th>불참</th><td>${ed('불참자 및 사유')}</td></tr></tbody></table>

 <h2>2. 안건</h2>
 <div class="lines">${ed('1.')}${ed('2.')}${ed('3.')}</div>

 <h2>3. 논의 요약</h2>
 <table><thead><tr><th style="width:22%">안건</th><th>주요 논의</th><th style="width:26%">결론</th></tr></thead>
 <tbody>${rows(3,[[''],[''],['']])}</tbody></table>

 <h2>4. 결정 사항</h2>
 <table><thead><tr><th style="width:5%">No</th><th style="width:42%">결정 내용</th><th>근거 · 전제</th></tr></thead>
 <tbody><tr><td class="c">1</td><td>${ed('')}</td><td>${ed('')}</td></tr>
 <tr><td class="c">2</td><td>${ed('')}</td><td>${ed('')}</td></tr>
 <tr><td class="c">3</td><td>${ed('')}</td><td>${ed('')}</td></tr></tbody></table>

 <h2>5. 실행 항목</h2>
 <table><thead><tr><th style="width:5%">No</th><th>할 일</th><th style="width:15%">담당</th><th style="width:15%">기한</th><th style="width:10%">완료</th></tr></thead>
 <tbody><tr><td class="c">1</td><td>${ed('')}</td><td>${ed('')}</td><td>${ed('')}</td><td></td></tr>
 <tr><td class="c">2</td><td>${ed('')}</td><td>${ed('')}</td><td>${ed('')}</td><td></td></tr>
 <tr><td class="c">3</td><td>${ed('')}</td><td>${ed('')}</td><td>${ed('')}</td><td></td></tr>
 <tr><td class="c">4</td><td>${ed('')}</td><td>${ed('')}</td><td>${ed('')}</td><td></td></tr></tbody></table>

 <h2>6. 다음 회의</h2>
 <table><tbody><tr><th style="width:76px">일시</th><td style="width:40%">${ed('')}</td><th style="width:76px">예정 안건</th><td>${ed('')}</td></tr></tbody></table>`,
 sign:['작성','검토','승인']
},
{
 id:'weekly', nav:'주간 업무보고', nd:'부서 → 임원 제출용',
 title:'주간 업무보고', sub:'금주 실적 · 차주 계획 · 지원 요청',
 meta:[['부서',''],['작성자',''],['대상 기간',''],['제출일','']],
 body:`
 <h2>1. 금주 실적</h2>
 <table><thead><tr><th style="width:38%">업무</th><th style="width:16%">목표</th><th style="width:16%">실적</th><th style="width:12%">달성</th><th>비고</th></tr></thead>
 <tbody>${rows(4,[[''],['','c'],['','c'],['%','c'],['']])}</tbody></table>

 <h2>2. 금주 주요 활동</h2>
 <div class="lines">${ed('1.')}${ed('2.')}${ed('3.')}</div>

 <h2>3. 차주 계획</h2>
 <table><thead><tr><th style="width:46%">업무</th><th style="width:24%">목표</th><th>완료 예정일</th></tr></thead>
 <tbody>${rows(4,[[''],[''],['','c']])}</tbody></table>

 <h2>4. 이슈 및 지원 요청</h2>
 <table><thead><tr><th style="width:16%">구분</th><th>내용 · 필요한 조치</th><th style="width:18%">요청 대상</th></tr></thead>
 <tbody>${rows(3,[['이슈 / 요청','c'],[''],['']])}</tbody></table>

 <h2>5. 특이사항</h2>
 <div class="lead">${ed('보고가 필요한 그 밖의 사항')}</div>`,
 sign:['작성자','팀장','담당 임원']
},
{
 id:'project', nav:'프로젝트 진행 현황', nd:'단계별 진척 · 리스크',
 title:'프로젝트 진행 현황', sub:'단계별 진척 · 리스크 · 의사결정 요청',
 meta:[['프로젝트명',''],['총괄(PM)',''],['수행 기간',''],['기준일','']],
 body:`
 <h2>1. 전체 진척</h2>
 <table><thead><tr><th style="width:26%">단계</th><th style="width:22%">기간</th><th style="width:12%">진척</th><th style="width:14%">상태</th><th>비고</th></tr></thead>
 <tbody>${rows(5,[[''],[''],['%','c'],['정상/지연','c'],['']])}</tbody></table>

 <h2>2. 금주 완료 / 차주 예정</h2>
 <div class="two">
   <table><thead><tr><th>금주 완료</th></tr></thead><tbody>${rows(3,[['']])}</tbody></table>
   <table><thead><tr><th>차주 예정</th></tr></thead><tbody>${rows(3,[['']])}</tbody></table>
 </div>

 <h2>3. 리스크 및 대응</h2>
 <table><thead><tr><th style="width:28%">리스크</th><th style="width:16%">영향</th><th>대응</th><th style="width:14%">담당</th></tr></thead>
 <tbody>${rows(3,[[''],['상/중/하','c'],[''],['']])}</tbody></table>

 <h2>4. 의사결정 요청</h2>
 <div class="lead">${ed('지금 결정되지 않으면 일정이 밀리는 사항과 선택지')}</div>`,
 sign:['작성','PM','담당 임원','대표이사']
},
{
 id:'meeting', nav:'거래처 미팅 기록', nd:'논의 · 합의 · 후속조치',
 title:'거래처 미팅 기록', sub:'논의 내용 · 합의 사항 · 후속 조치',
 meta:[['일시',''],['장소',''],['거래처',''],['당사 참석','']],
 body:`
 <h2>1. 미팅 목적</h2>
 <div class="lead">${ed('무엇을 얻으러 갔는가 — 한두 문장')}</div>

 <h2>2. 상대측 참석</h2>
 <table><tbody><tr><th style="width:76px">참석자</th><td>${ed('소속 · 직위 · 성명')}</td></tr></tbody></table>

 <h2>3. 논의 내용</h2>
 <table><thead><tr><th style="width:20%">항목</th><th>상대 의견</th><th>당사 의견</th></tr></thead>
 <tbody>${rows(4,[[''],[''],['']])}</tbody></table>

 <h2>4. 합의 사항</h2>
 <div class="lines">${ed('1.')}${ed('2.')}</div>

 <h2>5. 후속 조치</h2>
 <table><thead><tr><th style="width:5%">No</th><th>조치 내용</th><th style="width:16%">담당</th><th style="width:16%">기한</th></tr></thead>
 <tbody><tr><td class="c">1</td><td>${ed('')}</td><td>${ed('')}</td><td>${ed('')}</td></tr>
 <tr><td class="c">2</td><td>${ed('')}</td><td>${ed('')}</td><td>${ed('')}</td></tr>
 <tr><td class="c">3</td><td>${ed('')}</td><td>${ed('')}</td><td>${ed('')}</td></tr></tbody></table>

 <h2>6. 작성자 소견</h2>
 <div class="lead">${ed('기록에는 안 남지만 전달해야 할 판단 — 분위기, 상대 결정권자, 다음 수')}</div>`,
 sign:['작성자','팀장','담당 임원']
},
{
 id:'handover', nav:'업무 인수인계서', nd:'담당 교체 시 누락 방지',
 title:'업무 인수인계서', sub:'담당 업무 · 진행 중 건 · 관계자 · 자료 위치',
 meta:[['인계자',''],['인수자',''],['부서',''],['인계일','']],
 body:`
 <h2>1. 담당 업무 개요</h2>
 <table><thead><tr><th style="width:34%">업무명</th><th style="width:16%">주기</th><th style="width:14%">난이도</th><th>유의사항</th></tr></thead>
 <tbody>${rows(4,[[''],['일/주/월','c'],['상/중/하','c'],['']])}</tbody></table>

 <h2>2. 진행 중인 건</h2>
 <table><thead><tr><th style="width:26%">건명</th><th>현재 상황</th><th style="width:15%">기한</th><th style="width:22%">다음 할 일</th></tr></thead>
 <tbody>${rows(4,[[''],[''],['','c'],['']])}</tbody></table>

 <h2>3. 거래처 · 관계자</h2>
 <table><thead><tr><th style="width:24%">구분</th><th style="width:26%">담당자</th><th>연락 방법 · 특이사항</th></tr></thead>
 <tbody>${rows(3,[[''],[''],['']])}</tbody></table>

 <h2>4. 자료 위치</h2>
 <table><thead><tr><th style="width:34%">자료</th><th>보관 위치</th><th style="width:24%">비고</th></tr></thead>
 <tbody>${rows(3,[[''],[''],['']])}</tbody></table>
 <div class="note">※ 시스템 계정·비밀번호는 본 문서에 적지 말고 사내 보안 절차에 따라 별도 인계하십시오.</div>

 <h2>5. 인계자 전달사항</h2>
 <div class="lead">${ed('문서에 안 적히는 맥락 — 조심할 사람, 깨지기 쉬운 절차, 과거에 틀어졌던 지점')}</div>`,
 sign:['인계자','인수자','부서장']
}
];

const sheet=document.getElementById('sheet'), nav=document.getElementById('nav');
let cur=0;

function render(i){
  const f=FORMS[i];
  sheet.innerHTML=`
  <div class="dh">
    <div>
      <img src="assets/nobiliaire-wordmark-navy.svg" alt="NOBILIAIRE">
      <h1>${f.title}</h1>
      <div class="sb">${f.sub}</div>
    </div>
    <div class="og"><b>NOBILIAIRE</b>사내 문서</div>
  </div>
  <div class="meta">${f.meta.map(m=>`<div><span>${m[0]}</span><div class="ed" contenteditable="true" data-ph="${m[1]||'입력'}"></div></div>`).join('')}</div>
  ${f.body}
  <div class="sg" style="grid-template-columns:repeat(${f.sign.length},1fr)">${f.sign.map(s=>`<div>${s}</div>`).join('')}</div>
  <div class="ft"><span>본 양식은 사내 문서 작성용 서식입니다. 내부 규정에 맞춰 수정하여 사용하실 수 있습니다.</span>
  <span><b>좋은기분(Feelsogood^^)</b></span></div>`;
}

nav.insertAdjacentHTML('beforeend', FORMS.map((f,i)=>
  `<button class="nitem${i===0?' on':''}" data-i="${i}"><span class="nn">${f.nav}</span><span class="nd">${f.nd}</span></button>`).join(''));

nav.addEventListener('click',e=>{
  const b=e.target.closest('.nitem'); if(!b) return;
  cur=+b.dataset.i;
  nav.querySelectorAll('.nitem').forEach(x=>x.classList.toggle('on',x===b));
  render(cur); window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('pdf').addEventListener('click',()=>window.print());
document.getElementById('clr').addEventListener('click',()=>render(cur));
render(0);
</script>
</body>
</html>
